name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure KV namespace
        run: |
          set -e
          KV_ID=""
          if npx wrangler@latest kv namespace list > /tmp/kv.json 2>/dev/null; then
            KV_ID=$(python3 -c "import json; d=json.load(open('/tmp/kv.json')); print(next((x['id'] for x in d if x.get('title') == 'CARDS'), ''))")
          fi
          if [ -z "$KV_ID" ]; then
            npx wrangler@latest kv namespace create CARDS > /tmp/kvnew.txt 2>&1 || true
            KV_ID=$(grep -oP 'id = "\K[^"]+' /tmp/kvnew.txt | head -1)
          fi
          if [ -n "$KV_ID" ]; then
            sed -i "s|^id = \".*\"|id = \"$KV_ID\"|" wrangler.toml
          fi
          echo "KV namespace id: ${KV_ID:-$(grep -oP 'id = "\K[^"]+' wrangler.toml | head -1)}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Pages project
        run: |
          npx wrangler@latest pages project create birthday-wishes --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name=birthday-wishes --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}