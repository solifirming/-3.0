name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Check Cloudflare Secrets
        id: check-secrets
        run: |
          HAS_ERRORS=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=Missing Secret::缺少 CLOUDFLARE_API_TOKEN！请在 GitHub 仓库中前往 Settings -> Secrets and variables -> Actions 添加此 Secret。"
            HAS_ERRORS=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error title=Missing Secret::缺少 CLOUDFLARE_ACCOUNT_ID！请在 GitHub 仓库中前往 Settings -> Secrets and variables -> Actions 添加此 Secret。"
            HAS_ERRORS=1
          fi
          if [ "$HAS_ERRORS" -eq 1 ]; then
            exit 1
          fi

      - name: Ensure KV namespace
        run: |
          KV_ID=""
          if npx --yes wrangler kv namespace list > /tmp/kv.json 2>/dev/null; then
            KV_ID=$(python3 -c "import json; d=json.load(open('/tmp/kv.json')); print(next((x['id'] for x in d if x.get('title') == 'CARDS'), ''))" 2>/dev/null || true)
          fi
          if [ -z "$KV_ID" ]; then
            npx --yes wrangler kv namespace create CARDS > /tmp/kvnew.txt 2>&1 || true
            KV_ID=$(grep -oP 'id = "\K[^"]+' /tmp/kvnew.txt 2>/dev/null | head -1 || true)
          fi
          if [ -n "$KV_ID" ]; then
            sed -i "s|^id = \".*\"|id = \"$KV_ID\"|" wrangler.toml
            echo "Updated wrangler.toml with KV namespace id: $KV_ID"
          else
            echo "Using existing KV id from wrangler.toml"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure Pages project
        run: |
          npx --yes wrangler pages project create birthday-wishes --production-branch="${{ github.ref_name }}" --compatibility-date=2024-11-01 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler pages deploy dist --project-name=birthday-wishes --branch="${{ github.ref_name }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
